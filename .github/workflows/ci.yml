name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build src/CleanVaiLon/CleanVaiLon.csproj -c Release --nologo

      - name: Unit tests (safe-delete rules, data formats)
        run: dotnet test tests/CleanVaiLon.Tests/CleanVaiLon.Tests.csproj -c Release --nologo --filter "Category!=Smoke"

      # The PowerShell version stays in legacy/ until the C# port is confirmed.
      - name: Legacy script – syntax check (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem -Recurse -Filter *.ps1) {
            $t = $null; $e = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$t, [ref]$e)
            if ($e) { $bad++; $e | ForEach-Object { "$($f.Name):$($_.Extent.StartLineNumber) $($_.Message)" } }
          }
          if ($bad) { exit 1 }

      - name: UTF-8 BOM on .ps1 files
        shell: powershell
        run: |
          $missing = Get-ChildItem -Recurse -Filter *.ps1 | Where-Object {
            $b = [IO.File]::ReadAllBytes($_.FullName)
            -not ($b.Length -ge 3 -and $b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF)
          }
          if ($missing) { $missing.FullName; exit 1 }

      - name: Legacy script – safe-delete rules
        shell: powershell
        run: .\legacy\tests\Test-Safety.ps1

      - name: Portable package builds
        shell: powershell
        run: .\tools\Build-Release.ps1 -SkipInstaller
